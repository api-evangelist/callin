name: Callin
description: 'Callin was a social podcasting and live-streaming platform founded by David Sacks and Axel
  Ericsson, backed by Craft Ventures, that let creators stream live audio, take listener questions, then
  record, edit, publish and share the result as a podcast episode. The company was acquired by Rumble
  (NASDAQ: RUM) in May 2023 and the standalone consumer app was subsequently wound down. As of enrichment
  the callin.com domain returns only a Cloudflare-gated placeholder and the provider exposes no public
  API, developer portal, documentation, or SDK surface to enrich.'
